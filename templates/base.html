<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Standby Overtime App{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Sidebar CSS -->
    <link href="{{ url_for('static', filename='css/sidebar.css') }}" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 280px;
            --sidebar-bg: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            --sidebar-accent: #e94560;
            --sidebar-text: #ffffff;
            --sidebar-text-muted: #a8b2d1;
            --sidebar-hover: rgba(233, 69, 96, 0.1);
            --sidebar-active: rgba(233, 69, 96, 0.2);
            --sidebar-border: rgba(255, 255, 255, 0.1);
            --sidebar-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --notification-badge: #ff4757;
            
            /* Enhanced main content theme variables */
            --main-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --main-bg-alt: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --card-border: rgba(255, 255, 255, 0.2);
            --text-primary: #2c3e50;
            --text-secondary: #6c757d;
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%);
            --warning-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --info-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        body {
            min-height: 100vh;
            background: var(--main-bg);
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background elements */
        body::before,
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        body::before {
            background: radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.2) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
        }

        body::after {
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            animation: slide 30s linear infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(1deg); }
            66% { transform: translateY(10px) rotate(-1deg); }
        }

        @keyframes slide {
            0% { transform: translateX(0); }
            100% { transform: translateX(60px); }
        }

        /* Enhanced Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            height: 100vh;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            position: fixed;
            left: 0;
            top: 0;
            z-index: 1000;
            box-shadow: var(--sidebar-shadow);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--sidebar-border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(233, 69, 96, 0.3);
            border-radius: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(233, 69, 96, 0.5);
        }

        /* Logo Section */
        .sidebar-logo {
            padding: 2rem 1.5rem 1.5rem;
            text-align: center;
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.1) 0%, rgba(233, 69, 96, 0.05) 100%);
            border-bottom: 1px solid var(--sidebar-border);
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .sidebar-logo::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(233, 69, 96, 0.1), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .sidebar-logo .logo-icon {
            font-size: 2.5rem;
            color: var(--sidebar-accent);
            margin-bottom: 0.5rem;
            display: block;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }

        .sidebar-logo .logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--sidebar-text);
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sidebar-logo .logo-subtitle {
            font-size: 0.75rem;
            color: var(--sidebar-text-muted);
            margin-top: 0.25rem;
            font-weight: 300;
        }

        /* Navigation */
        .sidebar-nav {
            padding: 0 1rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .nav-item {
            margin-bottom: 0.5rem;
            position: relative;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 1rem 1.25rem;
            color: var(--sidebar-text-muted);
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            font-weight: 500;
            letter-spacing: 0.5px;
            position: relative;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: var(--sidebar-accent);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .nav-link:hover {
            color: var(--sidebar-text);
            background: var(--sidebar-hover);
            transform: translateX(8px);
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.15);
        }

        .nav-link:hover::before {
            transform: scaleY(1);
        }

        .nav-link.active {
            color: var(--sidebar-text);
            background: var(--sidebar-active);
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.2);
        }

        .nav-link.active::before {
            transform: scaleY(1);
        }

        .nav-link i {
            font-size: 1.25rem;
            margin-right: 1rem;
            width: 24px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .nav-link:hover i {
            color: var(--sidebar-accent);
            transform: scale(1.1);
        }

        .nav-link.active i {
            color: var(--sidebar-accent);
        }

        /* Notification Badge */
        .nav-link .notification-badge {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: var(--notification-badge);
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Bottom Section */
        .sidebar-bottom {
            margin-top: auto;
            padding: 1.5rem 1rem;
            border-top: 1px solid var(--sidebar-border);
            background: rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }

        .sidebar-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: rgba(233, 69, 96, 0.1);
            border-radius: 12px;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .sidebar-stats:hover {
            background: rgba(233, 69, 96, 0.15);
            transform: translateY(-2px);
        }

        .stat-item {
            text-align: center;
            position: relative;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--sidebar-accent);
            display: block;
            transition: all 0.3s ease;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--sidebar-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-item.loading .stat-value {
            opacity: 0.5;
        }

        .stat-item.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            margin: -8px 0 0 -8px;
            border: 2px solid var(--sidebar-accent);
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Main Content Adjustment */
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 2rem;
            min-height: 100vh;
            transition: margin-left 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .navbar {
            margin-left: var(--sidebar-width);
            background: var(--card-bg) !important;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
            transition: margin-left 0.3s ease;
            position: relative;
            z-index: 10;
        }

        /* Enhanced Card Styling */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(20px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--accent-gradient);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-header {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            border-bottom: 1px solid var(--card-border);
            padding: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            position: relative;
        }

        .card-body {
            padding: 1.5rem;
            color: var(--text-secondary);
        }

        /* Enhanced Typography */
        h1, h2, h3, h4, h5, h6 {
            color: var(--text-primary);
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2.5rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h2 {
            font-size: 2rem;
            position: relative;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: -0.5rem;
            left: 0;
            width: 60px;
            height: 4px;
            background: var(--accent-gradient);
            border-radius: 2px;
        }

        /* Enhanced Buttons */
        .btn {
            border-radius: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            border: none;
            padding: 0.75rem 1.5rem;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: var(--accent-gradient);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .btn-success {
            background: var(--success-gradient);
            box-shadow: 0 4px 15px rgba(86, 171, 47, 0.4);
        }

        .btn-warning {
            background: var(--warning-gradient);
            box-shadow: 0 4px 15px rgba(240, 147, 251, 0.4);
        }

        .btn-info {
            background: var(--info-gradient);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        /* Enhanced Tables */
        .table {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
        }

        .table thead th {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border: none;
            color: var(--text-primary);
            font-weight: 600;
            padding: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.875rem;
        }

        .table tbody tr {
            transition: all 0.3s ease;
        }

        .table tbody tr:hover {
            background: rgba(102, 126, 234, 0.05);
            transform: scale(1.01);
        }

        .table tbody td {
            padding: 1rem;
            border: none;
            border-bottom: 1px solid var(--card-border);
            color: var(--text-secondary);
        }

        /* Enhanced Form Elements */
        .form-control, .form-select {
            border-radius: 12px;
            border: 2px solid var(--card-border);
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            padding: 0.75rem 1rem;
        }

        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            background: rgba(255, 255, 255, 0.98);
        }

        /* Enhanced Alerts */
        .alert {
            border-radius: 12px;
            border: none;
            backdrop-filter: blur(10px);
            font-weight: 500;
        }

        .alert-primary {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            color: #667eea;
        }

        .alert-success {
            background: linear-gradient(135deg, rgba(86, 171, 47, 0.1) 0%, rgba(168, 230, 207, 0.1) 100%);
            color: #56ab2f;
        }

        .alert-warning {
            background: linear-gradient(135deg, rgba(240, 147, 251, 0.1) 0%, rgba(245, 87, 108, 0.1) 100%);
            color: #f093fb;
        }

        .alert-info {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.1) 0%, rgba(0, 242, 254, 0.1) 100%);
            color: #4facfe;
        }

        /* Enhanced Badges */
        .badge {
            border-radius: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 0.5rem 0.75rem;
        }

        .badge-primary {
            background: var(--accent-gradient);
        }

        .badge-success {
            background: var(--success-gradient);
        }

        .badge-warning {
            background: var(--warning-gradient);
        }

        .badge-info {
            background: var(--info-gradient);
        }

        /* Enhanced Progress Bars */
        .progress {
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            height: 12px;
            overflow: hidden;
        }

        .progress-bar {
            background: var(--accent-gradient);
            border-radius: 12px;
            transition: width 0.6s ease;
        }

        /* Enhanced List Groups */
        .list-group-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .list-group-item:hover {
            transform: translateX(8px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        /* Enhanced Modal */
        .modal-content {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
        }

        .modal-header {
            border-bottom: 1px solid var(--card-border);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
        }

        .modal-footer {
            border-top: 1px solid var(--card-border);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.1) 100%);
        }

        /* Enhanced Dropdown */
        .dropdown-menu {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(20px);
        }

        .dropdown-item {
            border-radius: 8px;
            margin: 0.25rem;
            transition: all 0.3s ease;
        }

        .dropdown-item:hover {
            background: rgba(102, 126, 234, 0.1);
            transform: translateX(4px);
        }

        /* Enhanced Navbar */
        .navbar-brand {
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Enhanced Text Colors */
        .text-primary {
            color: #667eea !important;
        }

        .text-success {
            color: #56ab2f !important;
        }

        .text-warning {
            color: #f093fb !important;
        }

        .text-info {
            color: #4facfe !important;
        }

        /* Glass Morphism Effect */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
        }

        /* Floating Animation */
        .float-animation {
            animation: float 6s ease-in-out infinite;
        }

        /* Pulse Animation */
        .pulse-animation {
            animation: pulse 2s ease-in-out infinite;
        }

        /* Shimmer Effect */
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                width: 100vw;
                min-width: 100vw;
            }

            .sidebar.show {
                transform: translateX(0);
            }

            .main-content,
            .navbar {
                margin-left: 0;
            }

            .sidebar-toggle {
                display: block !important;
            }

            /* Enhanced mobile styling */
            .main-content {
                padding: 1rem;
            }

            .card {
                margin-bottom: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            h2 {
                font-size: 1.75rem;
            }

            .btn {
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
            }
        }

        /* Sidebar Toggle Button */
        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 1001;
            background: var(--sidebar-accent);
            border: none;
            color: white;
            padding: 0.75rem;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.3);
            transition: all 0.3s ease;
        }

        .sidebar-toggle:hover {
            background: #d63384;
            transform: scale(1.05);
        }

        /* Overlay for mobile */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            backdrop-filter: blur(2px);
        }

        .sidebar-overlay.show {
            display: block;
        }

        /* Enhanced animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-item {
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }

        .nav-item:nth-child(1) { animation-delay: 0.1s; }
        .nav-item:nth-child(2) { animation-delay: 0.2s; }
        .nav-item:nth-child(3) { animation-delay: 0.3s; }
        .nav-item:nth-child(4) { animation-delay: 0.4s; }

        /* Active page indicator */
        .nav-link.active {
            position: relative;
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            background: var(--sidebar-accent);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        /* Loading states */
        .loading-shimmer {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        /* Accessibility improvements */
        .nav-link:focus {
            outline: 2px solid var(--sidebar-accent);
            outline-offset: 2px;
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            .sidebar {
                border-right: 2px solid var(--sidebar-text);
            }
            
            .nav-link.active {
                border: 2px solid var(--sidebar-accent);
            }
        }

        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            .sidebar,
            .nav-link,
            .sidebar-stats,
            .sidebar-toggle {
                transition: none;
            }
            
            .nav-item {
                animation: none;
                opacity: 1;
            }
            
            .sidebar-logo::before {
                animation: none;
            }
        }

        /* Enhanced spacing and layout utilities */
        .section-spacing {
            margin-bottom: 3rem;
        }

        .card-spacing {
            margin-bottom: 2rem;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .gradient-text {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .gradient-border {
            position: relative;
            border-radius: 16px;
            padding: 2px;
            background: var(--accent-gradient);
        }

        .gradient-border > * {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 1.5rem;
        }

        /* Enhanced loading states */
        .loading-skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Enhanced focus states for accessibility */
        .btn:focus,
        .form-control:focus,
        .form-select:focus,
        .nav-link:focus {
            outline: 2px solid var(--sidebar-accent);
            outline-offset: 2px;
        }

        /* Enhanced scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-gradient);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4c93 100%);
        }

        /* Enhanced selection styling */
        ::selection {
            background: rgba(102, 126, 234, 0.3);
            color: var(--text-primary);
        }

        ::-moz-selection {
            background: rgba(102, 126, 234, 0.3);
            color: var(--text-primary);
        }

        /* Enhanced tooltip styling */
        .tooltip {
            backdrop-filter: blur(10px);
        }

        .tooltip-inner {
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            box-shadow: var(--card-shadow);
        }

        /* Enhanced popover styling */
        .popover {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(20px);
        }

        .popover-header {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            border-bottom: 1px solid var(--card-border);
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Enhanced pagination */
        .page-link {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            border-radius: 8px;
            margin: 0 0.25rem;
            transition: all 0.3s ease;
        }

        .page-link:hover {
            background: rgba(102, 126, 234, 0.1);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .page-item.active .page-link {
            background: var(--accent-gradient);
            border-color: transparent;
            color: white;
        }

        /* Enhanced breadcrumb */
        .breadcrumb {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(10px);
        }

        .breadcrumb-item + .breadcrumb-item::before {
            color: var(--text-secondary);
        }

        /* Enhanced jumbotron */
        .jumbotron {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 3rem 2rem;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
        }

        /* Enhanced figure */
        .figure {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(10px);
        }

        .figure-caption {
            color: var(--text-secondary);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- Skip to main content link for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <!-- Mobile Toggle Button -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar navigation">
        <i class="bi bi-list"></i>
    </button>

    <!-- Mobile Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="d-flex">
        <nav class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
            <div class="sidebar-logo">
                <i class="bi bi-lightning-charge logo-icon" aria-hidden="true"></i>
                <h1 class="logo-text">Standby</h1>
                <p class="logo-subtitle">Overtime Management</p>
            </div>
            
            <div class="sidebar-nav">
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item">
                        <a href="/dashboard" class="nav-link" data-route="dashboard">
                            <i class="bi bi-speedometer2" aria-hidden="true"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/calendar" class="nav-link" data-route="calendar">
                            <i class="bi bi-calendar-event" aria-hidden="true"></i>
                            <span>Calendar</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/roster" class="nav-link" data-route="roster">
                            <i class="bi bi-people" aria-hidden="true"></i>
                            <span>Roster</span>
                            <span class="notification-badge" id="rosterNotifications" style="display: none;">0</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/overtime" class="nav-link" data-route="overtime">
                            <i class="bi bi-clock-history" aria-hidden="true"></i>
                            <span>Overtime</span>
                            <span class="notification-badge" id="overtimeNotifications" style="display: none;">0</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="sidebar-bottom">
                <div class="sidebar-stats" id="sidebarStats">
                    <div class="stat-item" id="currentStandbyStat">
                        <span class="stat-value" id="currentStandby">-</span>
                        <span class="stat-label">On Duty</span>
                    </div>
                    <div class="stat-item" id="totalHoursStat">
                        <span class="stat-value" id="totalHours">0</span>
                        <span class="stat-label">Hours</span>
                    </div>
                </div>
                <div class="text-center">
                    <small class="text-muted">
                        <i class="bi bi-heart-fill text-danger" aria-hidden="true"></i>
                        Powered by Team
                    </small>
                </div>
            </div>
        </nav>

        <div class="flex-grow-1">
            <nav class="navbar navbar-expand-lg navbar-light shadow-sm">
                <div class="container-fluid">
                    <span class="navbar-brand mb-0 h1">
                        <i class="bi bi-lightning-charge text-primary me-2" aria-hidden="true"></i>
                        Standby Overtime App
                    </span>
                    <div class="navbar-nav ms-auto">
                        <span class="navbar-text">
                            <i class="bi bi-clock text-muted me-1" aria-hidden="true"></i>
                            <span id="currentTime"></span>
                        </span>
                    </div>
                </div>
            </nav>
            <main class="main-content" id="main-content">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Sidebar Utilities -->
    <script src="{{ url_for('static', filename='js/sidebar-utils.js') }}"></script>
    
    <script>
        // Enhanced Sidebar functionality
        class SidebarManager {
            constructor() {
                this.sidebar = document.getElementById('sidebar');
                this.sidebarToggle = document.getElementById('sidebarToggle');
                this.sidebarOverlay = document.getElementById('sidebarOverlay');
                this.currentTimeElement = document.getElementById('currentTime');
                this.currentStandbyElement = document.getElementById('currentStandby');
                this.totalHoursElement = document.getElementById('totalHours');
                this.currentStandbyStat = document.getElementById('currentStandbyStat');
                this.totalHoursStat = document.getElementById('totalHoursStat');
                this.rosterNotifications = document.getElementById('rosterNotifications');
                this.overtimeNotifications = document.getElementById('overtimeNotifications');
                
                this.currentRoute = this.getCurrentRoute();
                this.updateInterval = null;
                this.statsUpdateInterval = null;
                
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.updateActiveNavLink();
                this.updateTime();
                this.updateSidebarStats();
                this.startTimers();
                this.checkForNotifications();
            }

            setupEventListeners() {
                // Mobile sidebar toggle
                this.sidebarToggle.addEventListener('click', () => this.toggleSidebar());
                this.sidebarOverlay.addEventListener('click', () => this.toggleSidebar());

                // Add hover effects to nav links
                const navLinks = document.querySelectorAll('.nav-link');
                navLinks.forEach(link => {
                    link.addEventListener('mouseenter', function() {
                        this.style.transform = 'translateX(8px) scale(1.02)';
                    });
                    
                    link.addEventListener('mouseleave', function() {
                        this.style.transform = 'translateX(0) scale(1)';
                    });
                });

                // Keyboard navigation
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && this.sidebar.classList.contains('show')) {
                        this.toggleSidebar();
                    }
                });
            }

            getCurrentRoute() {
                const path = window.location.pathname;
                if (path === '/') return 'dashboard';
                return path.substring(1).split('/')[0];
            }

            updateActiveNavLink() {
                const navLinks = document.querySelectorAll('.nav-link');
                navLinks.forEach(link => {
                    link.classList.remove('active');
                    const route = link.getAttribute('data-route');
                    if (route === this.currentRoute) {
                        link.classList.add('active');
                    }
                });
            }

            toggleSidebar() {
                this.sidebar.classList.toggle('show');
                this.sidebarOverlay.classList.toggle('show');
                
                // Update aria-expanded for accessibility
                const isExpanded = this.sidebar.classList.contains('show');
                this.sidebarToggle.setAttribute('aria-expanded', isExpanded);
            }

            updateTime() {
                const now = new Date();
                const timeString = now.toLocaleTimeString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: true
                });
                this.currentTimeElement.textContent = timeString;
            }

            async updateSidebarStats() {
                try {
                    // Show loading state
                    this.currentStandbyStat.classList.add('loading');
                    this.totalHoursStat.classList.add('loading');

                    // Fetch current standby person
                    const response = await fetch('/api/current-standby');
                    if (response.ok) {
                        const data = await response.json();
                        this.currentStandbyElement.textContent = data.current_standby || 'None';
                    }

                    // Fetch total hours for current month
                    const hoursResponse = await fetch('/api/total-hours');
                    if (hoursResponse.ok) {
                        const hoursData = await hoursResponse.json();
                        this.totalHoursElement.textContent = hoursData.total_hours || '0';
                    }

                } catch (error) {
                    console.warn('Failed to update sidebar stats:', error);
                    // Fallback to static data
                    this.currentStandbyElement.textContent = 'Active';
                    this.totalHoursElement.textContent = '0';
                } finally {
                    // Remove loading state
                    this.currentStandbyStat.classList.remove('loading');
                    this.totalHoursStat.classList.remove('loading');
                }
            }

            async checkForNotifications() {
                try {
                    // Check for roster changes
                    const rosterResponse = await fetch('/api/roster-notifications');
                    if (rosterResponse.ok) {
                        const data = await rosterResponse.json();
                        if (data.count > 0) {
                            this.rosterNotifications.textContent = data.count;
                            this.rosterNotifications.style.display = 'flex';
                        }
                    }

                    // Check for overtime notifications
                    const overtimeResponse = await fetch('/api/overtime-notifications');
                    if (overtimeResponse.ok) {
                        const data = await overtimeResponse.json();
                        if (data.count > 0) {
                            this.overtimeNotifications.textContent = data.count;
                            this.overtimeNotifications.style.display = 'flex';
                        }
                    }
                } catch (error) {
                    console.warn('Failed to check notifications:', error);
                }
            }

            startTimers() {
                // Update time every second
                this.updateInterval = setInterval(() => this.updateTime(), 1000);
                
                // Update stats every 30 seconds
                this.statsUpdateInterval = setInterval(() => {
                    this.updateSidebarStats();
                    this.checkForNotifications();
                }, 30000);
            }

            destroy() {
                if (this.updateInterval) clearInterval(this.updateInterval);
                if (this.statsUpdateInterval) clearInterval(this.statsUpdateInterval);
            }
        }

        // Initialize sidebar when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            window.sidebarManager = new SidebarManager();
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (window.sidebarManager) {
                window.sidebarManager.destroy();
            }
        });
    </script>
</body>
</html>
