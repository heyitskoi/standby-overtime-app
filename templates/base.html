<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Standby Overtime App{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        .sidebar {
            min-width: 220px;
            max-width: 220px;
            min-height: 100vh;
            background: #343a40;
            color: #fff;
        }
        .sidebar .nav-link {
            color: #adb5bd;
        }
        .sidebar .nav-link.active, .sidebar .nav-link:hover {
            color: #fff;
            background: #495057;
        }
        .sidebar .sidebar-logo {
            font-size: 1.5rem;
            font-weight: bold;
            padding: 1.5rem 1rem;
            text-align: center;
            background: #23272b;
        }
        .main-content {
            margin-left: 220px;
            padding: 2rem;
        }
        .navbar {
            margin-left: 220px;
        }
        @media (max-width: 768px) {
            .sidebar {
                min-width: 100vw;
                max-width: 100vw;
                min-height: auto;
                position: static;
            }
            .main-content, .navbar {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="d-flex">
        <nav class="sidebar flex-shrink-0 d-flex flex-column">
            <div class="sidebar-logo mb-4">
                <i class="bi bi-lightning-charge"></i> LOGO
            </div>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="/dashboard" class="nav-link">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>
                <li>
                    <a href="/calendar" class="nav-link">
                        <i class="bi bi-calendar-event"></i> Calendar
                    </a>
                </li>
                <li>
                    <a href="/roster" class="nav-link">
                        <i class="bi bi-people"></i> Roster
                    </a>
                </li>
                <li>
                    <a href="/overtime" class="nav-link">
                        <i class="bi bi-clock-history"></i> Overtime
                    </a>
                </li>
            </ul>
        </nav>
        <div class="flex-grow-1">
            <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
                <div class="container-fluid">
                    <span class="navbar-brand mb-0 h1">Standby Overtime App</span>
                </div>
            </nav>
            <main class="main-content">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
